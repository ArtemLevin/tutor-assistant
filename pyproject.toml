[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tutor-assistant"
version = "1.0.0rc1"
description = "Desktop pipeline: lesson recording, local transcription and material-generation jobs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{name = "Лёвин Артём Александрович"}]
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "platformdirs>=4.3,<5",
  "numpy>=2.0,<3",
  "sounddevice>=0.5,<1",
  "SoundCard>=0.4.6,<0.5",
  "soundfile>=0.13,<1",
  "pypdf>=5.1,<7",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
transcription = ["faster-whisper>=1.1,<2"]
packaging = ["pyinstaller>=6.18,<7"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]
all = ["PySide6>=6.8,<7", "faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[project.scripts]
tutor-assistant = "tutor_assistant.cli:main"
tutor-assistant-gui = "tutor_assistant.ui.recording_recovery_app:main"
tutor-assistant-recover = "tutor_assistant.recording.recovery:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "ollama: integration tests that require a local Ollama instance",
  "yandex: integration tests that require Yandex AI Studio credentials",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tutor_assistant/ui/lesson_journal_interactions.py" = ["I001"]
"src/tutor_assistant/ui/lesson_journal_closeout.py" = ["I001"]
"src/tutor_assistant/ui/lesson_journal_closeout_stable.py" = ["I001"]
