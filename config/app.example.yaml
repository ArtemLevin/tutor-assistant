setup_completed: false
workspace: data
students_file: config/students.yaml

recording:
  output_format: m4a
  mic_device: null
  system_device_id: null
  system_backend: soundcard

whisper:
  model: small
  device: cpu
  compute_type: int8
  language: ru

repository:
  # Existing repository used by manual publication / web / LaTeX workflows.
  # This may remain the public GitHub Pages repository.
  students_repo: ../students-26-27
  remote: origin
  base_branch: main
  push: false
  use_worktree: true
  repository_full_name: owner/students-pages

# Optional dedicated target for AUTO_TRANSCRIPT_GITHUB.
# Leave null until a separate PRIVATE repository is cloned and configured.
# If null/omitted, automatic publication falls back to "repository" and still
# requires that target to be PRIVATE.
automatic_transcript_repository: null

latex:
  enabled: true
  auto_monitor: false
  publish_pdf: false
  engine: pdflatex
  render_preview: true

quick_start:
  last_student_id: null

normalization:
  enabled: true
  provider: ollama
  base_url: http://127.0.0.1:11434
  allow_remote_endpoint: false
  model: qwen3:8b
  allow_cloud_processing: false
  cloud_policy: ask_every_time
  require_manual_approval: true
