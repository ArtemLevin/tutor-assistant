name: Agent Slice 11 Presentation Migration

on:
  push:
    branches:
      - agent/wave2-recording-presentation
    paths:
      - .github/workflows/agent_slice11_cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave2-recording-presentation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic migration
        run: python .github/agent_slice11_cleanup.py
      - name: Remove one-shot migration files
        run: rm .github/agent_slice11_cleanup.py .github/workflows/agent_slice11_cleanup.yml
      - name: Commit migrated sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "refactor(recording): route presentation through model"
          git push origin HEAD:agent/wave2-recording-presentation
