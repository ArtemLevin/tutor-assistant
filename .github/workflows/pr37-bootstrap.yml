name: PR 37 bootstrap

on:
  push:
    branches: [agent/resumable-normalization-checkpoints]
    paths:
      - scripts/pr37_bootstrap.py.gz.b64
      - .github/workflows/pr37-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resumable-normalization-checkpoints
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode implementation script
        shell: bash
        run: base64 -d scripts/pr37_bootstrap.py.gz.b64 | gzip -d > scripts/pr37_bootstrap.py
      - name: Apply resumable normalization implementation
        run: python scripts/pr37_bootstrap.py
      - name: Refresh lock file
        run: |
          python -m pip install uv
          uv lock
      - name: Basic syntax verification
        run: python -m compileall -q src/tutor_assistant tests
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs pyproject.toml uv.lock src tests
          git commit -m "Add durable resumable normalization checkpoints"
          git push origin HEAD:agent/resumable-normalization-checkpoints
