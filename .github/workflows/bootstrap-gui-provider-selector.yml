name: Bootstrap GUI provider selector

on:
  push:
    branches:
      - agent/gui-content-filter-provider-selector

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gui-content-filter-provider-selector
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply provider selector changes
        run: python scripts/apply_gui_provider_selector.py
      - name: Format modified Python files
        run: |
          python -m pip install ruff
          ruff check --fix src/tutor_assistant/ui/app.py src/tutor_assistant/ui/normalization_provider.py tests/test_normalization_provider_gui.py
          ruff format src/tutor_assistant/ui/app.py src/tutor_assistant/ui/normalization_provider.py tests/test_normalization_provider_gui.py
          python -m compileall -q src/tutor_assistant tests
      - name: Commit product changes
        shell: bash
        run: |
          rm scripts/apply_gui_provider_selector.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add GUI selector for Ollama and Yandex filtering"
          git push origin HEAD:agent/gui-content-filter-provider-selector
