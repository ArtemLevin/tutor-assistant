name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr41:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/transcript-workspace-redesign

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify implementation patches
        run: >-
          python -m py_compile
          scripts/pr41_patch_app_structure.py
          scripts/pr41_patch_app_state.py
          scripts/pr41_patch_misc.py

      - name: Apply transcript workspace implementation
        run: |
          python scripts/pr41_patch_app_structure.py
          python scripts/pr41_patch_app_state.py
          python scripts/pr41_patch_misc.py

      - name: Install uv
        run: python -m pip install uv

      - name: Refresh lock and dependencies
        run: |
          uv lock
          uv sync --extra desktop --group dev

      - name: Lint and compile
        run: |
          uv run ruff check . --fix
          uv run ruff check .
          uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused transcript workspace tests
        run: >-
          uv run pytest -q --tb=short --junitxml=focused-report.xml
          tests/test_transcript_workspace_gui.py
          tests/test_normalization_provider_gui.py
          tests/test_normalization_progress_gui.py
          tests/test_normalization_service.py
          tests/test_normalization_checkpoint_store.py
          tests/test_normalization_resume.py

      - name: Upload focused test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr41-focused-report
          path: focused-report.xml
          if-no-files-found: ignore

      - name: Full test suite
        run: uv run pytest -q

      - name: Remove bootstrap files
        shell: bash
        run: |
          rm -f scripts/pr41_patch_app_structure.py
          rm -f scripts/pr41_patch_app_state.py
          rm -f scripts/pr41_patch_misc.py
          rm -f scripts/pr41_windows_content_product.txt
          rm -f .agent/pr41-trigger.txt
          rm -f focused-report.xml

      - name: Commit implementation
        shell: bash
        run: |
          set -o pipefail
          REPORT="$RUNNER_TEMP/pr41-commit-report.txt"
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git restore --staged .github/workflows/windows-content.yml
            git checkout -- .github/workflows/windows-content.yml
            git diff --cached --check
            git commit -m "Implement state-driven transcript workspace"
            git push origin HEAD:feature/transcript-workspace-redesign
          } 2>&1 | tee "$REPORT"

      - name: Upload commit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr41-commit-report
          path: ${{ runner.temp }}/pr41-commit-report.txt
          if-no-files-found: ignore
