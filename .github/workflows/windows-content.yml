name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr40:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/reviewable-normalization-fallbacks

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify migration scripts
        shell: pwsh
        run: |
          $core = (Get-FileHash scripts/pr40_apply_core.py -Algorithm SHA256).Hash.ToLower()
          $ui = (Get-FileHash scripts/pr40_apply_ui.py -Algorithm SHA256).Hash.ToLower()
          if ($core -ne '2e2d27db2f8b018100e7fbc6d74f45c07b028b126625c7ebcfbc8487e638834a') { throw "core script mismatch: $core" }
          if ($ui -ne '86b48eae0c3954036c9ed1d9e6833679ee452efa6c7cbb8d1ca1628f37a7e272') { throw "ui script mismatch: $ui" }

      - name: Apply implementation
        run: |
          python scripts/pr40_apply_core.py
          python scripts/pr40_apply_ui.py

      - name: Install uv
        run: python -m pip install uv

      - name: Refresh lock and dependencies
        run: |
          uv lock
          uv sync --extra desktop --group dev

      - name: Lint and compile
        run: |
          uv run ruff check . --fix
          uv run ruff check .
          uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused fallback tests
        run: >-
          uv run pytest -q
          tests/test_normalization_service.py
          tests/test_normalization_checkpoint_store.py
          tests/test_normalization_resume.py
          tests/test_normalization_provider_gui.py
          tests/test_filtering_feature_contracts.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Restore permanent CI and remove bootstrap files
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/windows-content.yml
          git rm scripts/pr40_apply_core.py
          git rm scripts/pr40_apply_ui.py
          git rm .github/workflows/pr40-bootstrap.yml
          git rm .agent/pr40-trigger.txt

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement reviewable normalization fallbacks"
          git push origin HEAD:feature/reviewable-normalization-fallbacks
