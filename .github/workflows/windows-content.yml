name: Apply content-filter contract tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.head_ref == 'agent/educational-content-filter-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/educational-content-filter-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract updates
        run: python scripts/patch_content_filter_contract_tests.py
      - name: Commit test updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align contracts with educational content filtering"
          git push origin HEAD:agent/educational-content-filter-hardening
