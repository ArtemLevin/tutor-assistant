name: Refresh content-filter lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'agent/educational-content-filter-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/educational-content-filter-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Refresh lock
        run: uv lock
      - name: Commit lock file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "Lock file already current"
            exit 0
          fi
          git commit -m "chore: refresh uv lock for 0.13.0"
          git push origin HEAD:agent/educational-content-filter-hardening
