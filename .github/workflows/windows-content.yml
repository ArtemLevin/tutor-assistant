name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Check lock file
        run: uv lock --check

      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev

      - name: Lint
        shell: pwsh
        run: |
          uv run ruff check . --output-format=concise 2>&1 | Tee-Object ruff-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-ruff-report
          path: ruff-report.txt
          if-no-files-found: ignore

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Privacy import smoke
        run: >-
          uv run python -c "from tutor_assistant.security import CloudConsentSession, credential_status, redact_text; assert redact_text('Authorization: Api-Key demo-secret-value') == 'Authorization: Api-Key [REDACTED]'; assert CloudConsentSession(); assert callable(credential_status)"

      - name: Added secret scan
        if: github.event_name == 'pull_request'
        run: uv run python scripts/scan_added_secrets.py ${{ github.event.pull_request.base.sha }}

      - name: Filtering, checkpoint and privacy contracts
        run: >-
          uv run pytest -q
          tests/test_filtering_feature_contracts.py
          tests/test_subject_aware_filtering.py
          tests/test_subject_manifest_compatibility.py
          tests/test_normalization_provider_gui.py
          tests/test_normalization_checkpoint_migration.py
          tests/test_normalization_checkpoint_store.py
          tests/test_normalization_resume.py
          tests/test_normalization_progress_gui.py
          tests/test_transcript_workspace_gui.py
          tests/test_credential_store.py
          tests/test_cloud_consent.py
          tests/test_cloud_privacy_migration.py
          tests/test_cloud_request_envelope.py
          tests/test_sensitive_data_redaction.py
          tests/test_privacy_support_bundle.py
          tests/test_privacy_doctor.py
          tests/test_cloud_consent_cli.py
          tests/test_cloud_service_consent.py

      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
