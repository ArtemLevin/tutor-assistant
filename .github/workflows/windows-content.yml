name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-pr38:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/cloud-processing-boundary
      - name: Build patch diagnostics
        shell: pwsh
        run: |
          $paths = @(
            '.agent/pr38/patch.00',
            '.agent/pr38/patch.01',
            '.agent/pr38/patch.02',
            '.agent/pr38/patch.05',
            '.agent/pr38/patch.06',
            '.agent/pr38/patch.04'
          )
          Remove-Item pr38-multipart-diagnostics.txt -ErrorAction SilentlyContinue
          foreach ($path in $paths) {
            if (Test-Path $path) {
              "$path length=$((Get-Item $path).Length) sha=$((Get-FileHash $path -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-multipart-diagnostics.txt
            } else {
              "$path missing" | Add-Content pr38-multipart-diagnostics.txt
            }
          }
          $payload = ($paths | ForEach-Object { Get-Content $_ -Raw }) -join ''
          Set-Content .agent/pr38/assembled.b64 -Value $payload -NoNewline
          "assembled length=$((Get-Item .agent/pr38/assembled.b64).Length) sha=$((Get-FileHash .agent/pr38/assembled.b64 -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-multipart-diagnostics.txt
          try {
            python -c "import base64,pathlib; p=pathlib.Path('.agent/pr38/assembled.b64'); pathlib.Path('.agent/pr38/product.patch.gz').write_bytes(base64.b64decode(p.read_text(), validate=True))" 2>&1 | Add-Content pr38-multipart-diagnostics.txt
            "gzip length=$((Get-Item .agent/pr38/product.patch.gz).Length) sha=$((Get-FileHash .agent/pr38/product.patch.gz -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-multipart-diagnostics.txt
            python -c "import gzip,pathlib; p=pathlib.Path('.agent/pr38/product.patch.gz'); pathlib.Path('.agent/pr38/product.patch').write_bytes(gzip.decompress(p.read_bytes()))" 2>&1 | Add-Content pr38-multipart-diagnostics.txt
            "patch length=$((Get-Item .agent/pr38/product.patch).Length) sha=$((Get-FileHash .agent/pr38/product.patch -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-multipart-diagnostics.txt
            git apply --check --whitespace=error-all .agent/pr38/product.patch 2>&1 | Add-Content pr38-multipart-diagnostics.txt
            "git_apply_exit=$LASTEXITCODE" | Add-Content pr38-multipart-diagnostics.txt
          } catch {
            "exception=$($_.Exception.Message)" | Add-Content pr38-multipart-diagnostics.txt
          }
          Get-Content pr38-multipart-diagnostics.txt
      - name: Upload multipart diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr38-multipart-diagnostics
          path: pr38-multipart-diagnostics.txt
          if-no-files-found: error
