name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr38:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/cloud-processing-boundary

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and unpack generator
        shell: pwsh
        run: |
          $parts = @(
            @{Path='.agent/pr38/payload.00'; Sha='429fc4a30a3a643af1f167c85210c13642802838a947dce2e47ff68a7d2076f3'},
            @{Path='.agent/pr38/payload.12'; Sha='c024f8c10b69187a1ae4e961d3e7ee8c767437c1f236531f8982901b01d4c8ef'},
            @{Path='.agent/pr38/payload.34'; Sha='4dcf00e157f6649b7e6e4df262660c6fcfd566d5c37cba171849bb92262ec967'}
          )
          foreach ($part in $parts) {
            $actual = (Get-FileHash $part.Path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $part.Sha) { throw "Payload part mismatch: $($part.Path) $actual" }
          }
          $payload = ($parts | ForEach-Object { Get-Content $_.Path -Raw }) -join ''
          Set-Content .agent/pr38/payload.b64 -Value $payload -NoNewline
          $payloadHash = (Get-FileHash .agent/pr38/payload.b64 -Algorithm SHA256).Hash.ToLower()
          if ($payloadHash -ne '2b3d5b25793a1f604695504d501600cbbbd0defae2a56276885fea5795275599') {
            throw "Combined payload SHA-256 mismatch: $payloadHash"
          }
          python -c "import base64, pathlib; src=pathlib.Path('.agent/pr38/payload.b64'); pathlib.Path('.agent/pr38/apply_pr38.py.gz').write_bytes(base64.b64decode(src.read_text()))"
          $archiveHash = (Get-FileHash .agent/pr38/apply_pr38.py.gz -Algorithm SHA256).Hash.ToLower()
          if ($archiveHash -ne 'b4b2e0c6c45e3b7924dcd47dbae89c0d10cdd8bdf5c93b135d821b9485c88176') {
            throw "Archive SHA-256 mismatch: $archiveHash"
          }
          python -c "import gzip, pathlib; source=pathlib.Path('.agent/pr38/apply_pr38.py.gz'); target=pathlib.Path('scripts/apply_pr38.py'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(gzip.decompress(source.read_bytes()))"
          $generatorHash = (Get-FileHash scripts/apply_pr38.py -Algorithm SHA256).Hash.ToLower()
          if ($generatorHash -ne '9dbaa182978390cc7b04092355a88a642ca7d91533ff6b3844b18250a57b229f') {
            throw "Generator SHA-256 mismatch: $generatorHash"
          }

      - name: Apply privacy implementation
        shell: pwsh
        run: |
          python scripts/apply_pr38.py *> pr38-apply.log
          $code = $LASTEXITCODE
          Get-Content pr38-apply.log
          if ($code -ne 0) { exit $code }

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr38-apply-diagnostics
          path: pr38-apply.log
          if-no-files-found: ignore

      - name: Preserve temporary workflow files
        shell: bash
        run: |
          git checkout -- .github/workflows/windows-content.yml
          git checkout -- .github/workflows/pr38-bootstrap.yml

      - name: Install uv
        run: python -m pip install uv

      - name: Refresh lock
        run: uv lock

      - name: Install dependencies
        run: uv sync --extra desktop --group dev

      - name: Ruff autofix
        run: uv run ruff check . --fix

      - name: Compile
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused privacy tests
        run: >-
          uv run pytest -q
          tests/test_credential_store.py
          tests/test_cloud_consent.py
          tests/test_cloud_privacy_migration.py
          tests/test_cloud_request_envelope.py
          tests/test_sensitive_data_redaction.py
          tests/test_privacy_support_bundle.py
          tests/test_privacy_doctor.py
          tests/test_cloud_consent_cli.py
          tests/test_cloud_service_consent.py
          tests/test_normalization_provider_gui.py
          tests/test_normalization_service.py

      - name: Remove one-time generator
        shell: pwsh
        run: |
          Remove-Item scripts/apply_pr38.py -Force -ErrorAction SilentlyContinue
          Remove-Item .agent/pr38 -Recurse -Force -ErrorAction SilentlyContinue

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement cloud privacy boundary and secure credentials"
          git push origin HEAD:security/cloud-processing-boundary

  content:
    if: github.event_name != 'pull_request' || github.head_ref != 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Check lock file
        run: uv lock --check
      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev
      - name: Lint
        shell: pwsh
        run: |
          uv run ruff check . --output-format=concise 2>&1 | Tee-Object ruff-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-ruff-report
          path: ruff-report.txt
          if-no-files-found: ignore
      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Filtering import smoke
        run: uv run python -c "from tutor_assistant.normalization.prompts import system_prompt; from tutor_assistant.ui.normalization_provider import provider_label; assert 'импульс' in system_prompt('physics').casefold(); assert provider_label('ollama') == 'Локальная LLM (Ollama)'"
      - name: Filtering and checkpoint contracts
        run: >-
          uv run pytest -q
          tests/test_filtering_feature_contracts.py
          tests/test_subject_aware_filtering.py
          tests/test_subject_manifest_compatibility.py
          tests/test_normalization_provider_gui.py
          tests/test_normalization_checkpoint_migration.py
          tests/test_normalization_checkpoint_store.py
          tests/test_normalization_resume.py
          tests/test_normalization_progress_gui.py
      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
