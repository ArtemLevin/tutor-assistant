name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr32:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/subject-aware-content-filtering' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subject-aware-content-filtering
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply subject profiles
        shell: bash
        run: |
          set +e
          python scripts/apply_pr32_subject_profiles.py > apply-pr32.log 2>&1
          status=$?
          if [ "$status" -ne 0 ] && grep -q "Expected block not found in README.md" apply-pr32.log; then
            python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = """API-ключ читается только из переменной окружения и в YAML не сохраняется.

Старые команды `normalize` и `normalization-doctor`, а также внутреннее имя
"""
          new = """API-ключ читается только из переменной окружения и в YAML не сохраняется.

Фильтр автоматически выбирает профиль по предмету занятия: математика, физика,
химия или общий консервативный режим. Предметные термины, формулы и единицы
защищаются отдельными словарями, а профиль и версия промпта сохраняются в manifest.

Старые команды `normalize` и `normalization-doctor`, а также внутреннее имя
"""
          if old not in text:
              raise RuntimeError("README subject-profile insertion point not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            status=$?
          fi
          git diff > apply-pr32.patch
          cat apply-pr32.log
          exit $status
      - name: Upload apply diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr32-apply-diagnostics
          path: |
            apply-pr32.log
            apply-pr32.patch
      - name: Format modified sources
        run: |
          python -m pip install ruff
          ruff check --fix src/tutor_assistant/normalization src/tutor_assistant/ui/normalization.py tests/test_subject_aware_filtering.py tests/test_normalization_models.py
          ruff format src/tutor_assistant/normalization src/tutor_assistant/ui/normalization.py tests/test_subject_aware_filtering.py tests/test_normalization_models.py
          python -m compileall -q src/tutor_assistant tests
      - name: Commit product changes
        shell: bash
        run: |
          rm scripts/apply_pr32_subject_profiles.py
          rm .github/workflows/bootstrap-pr32-subject-filter.yml
          git checkout origin/main -- .github/workflows/windows-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add subject-aware educational content filtering"
          git push origin HEAD:agent/subject-aware-content-filtering

  content:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'agent/subject-aware-content-filtering'
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Check lock file
        run: uv lock --check
      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
