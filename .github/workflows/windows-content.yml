name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr38:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/cloud-processing-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble verified generator
        shell: pwsh
        run: |
          $parts = @(
            @{Path='.agent/pr38/payload.00'; Sha='429fc4a30a3a643af1f167c85210c13642802838a947dce2e47ff68a7d2076f3'},
            @{Path='.agent/pr38/payload.12'; Sha='c024f8c10b69187a1ae4e961d3e7ee8c767437c1f236531f8982901b01d4c8ef'},
            @{Path='.agent/pr38/payload.34'; Sha='4dcf00e157f6649b7e6e4df262660c6fcfd566d5c37cba171849bb92262ec967'}
          )
          foreach ($part in $parts) {
            $actual = (Get-FileHash $part.Path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $part.Sha) { throw "Payload part mismatch: $($part.Path) $actual" }
          }
          $payload = ($parts | ForEach-Object { Get-Content $_.Path -Raw }) -join ''
          Set-Content .agent/pr38/payload.b64 -Value $payload -NoNewline
          $payloadHash = (Get-FileHash .agent/pr38/payload.b64 -Algorithm SHA256).Hash.ToLower()
          if ($payloadHash -ne '2b3d5b25793a1f604695504d501600cbbbd0defae2a56276885fea5795275599') {
            throw "Combined payload SHA-256 mismatch: $payloadHash"
          }
          python -c "import base64,gzip,pathlib; data=base64.b64decode(pathlib.Path('.agent/pr38/payload.b64').read_text()); pathlib.Path('scripts/apply_pr38.py').write_bytes(gzip.decompress(data))"
          $rawHash = (Get-FileHash scripts/apply_pr38.py -Algorithm SHA256).Hash.ToLower()
          if ($rawHash -ne '9dbaa182978390cc7b04092355a88a642ca7d91533ff6b3844b18250a57b229f') {
            throw "Generator SHA-256 mismatch: $rawHash"
          }
      - name: Apply contextual generator corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/apply_pr38.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "('    InvalidPlainTextOutputError,\\n', '    CloudProcessingConsentRequiredError,\\n    InvalidPlainTextOutputError,\\n')",
                  "('from .errors import (\\n    InvalidPlainTextOutputError,\\n', 'from .errors import (\\n    CloudProcessingConsentRequiredError,\\n    InvalidPlainTextOutputError,\\n')",
              ),
              (
                  "('    YandexAIStudioTimeoutError,\\n', '')",
                  "('    UnsafeNormalizationResultError,\\n    YandexAIStudioTimeoutError,\\n)', '    UnsafeNormalizationResultError,\\n)'), ('    OllamaTimeoutError,\\n    YandexAIStudioTimeoutError,\\n)', '    OllamaTimeoutError,\\n)')",
              ),
              (
                  "('                progress=progress,\\n                retry_indeterminate=retry_indeterminate,\\n', '                progress=progress,\\n                retry_indeterminate=retry_indeterminate,\\n                cloud_consent=cloud_consent,\\n')",
                  "('                source_artifact=source_artifact,\\n                cancellation=cancellation,\\n                progress=progress,\\n                retry_indeterminate=retry_indeterminate,\\n', '                source_artifact=source_artifact,\\n                cancellation=cancellation,\\n                progress=progress,\\n                retry_indeterminate=retry_indeterminate,\\n                cloud_consent=cloud_consent,\\n')",
              ),
              (
                  "('        self._retry_indeterminate_after_worker = False\\n', '        self._retry_indeterminate_after_worker = False\\n        self._cloud_consent_session = CloudConsentSession()\\n')",
                  "('        self._normalization_lesson_id: str | None = None\\n        self._retry_indeterminate_after_worker = False\\n', '        self._normalization_lesson_id: str | None = None\\n        self._retry_indeterminate_after_worker = False\\n        self._cloud_consent_session = CloudConsentSession()\\n')",
              ),
              (
                  "'tests/test_normalization_checkpoint_migration.py': [('assert len(repository.applied_migrations()) == 9', 'assert len(repository.applied_migrations()) == 10')]",
                  "'tests/test_normalization_checkpoint_migration.py': [('    assert 9 in versions\\n', '    assert 9 in versions\\n    assert 10 in versions\\n')]",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"generator correction mismatch: {text.count(old)}: {old[:80]}")
              text = text.replace(old, new, 1)

          text += r'''
          # Focused privacy regression fixes.
          _redaction = Path("src/tutor_assistant/security/redaction.py")
          _redaction_text = _redaction.read_text(encoding="utf-8")
          _redaction_old = """class SensitiveDataFilter(logging.Filter):
              def filter(self, record: logging.LogRecord) -> bool:
                  record.msg = redact_value(record.msg)
                  if record.args:
                      record.args = redact_value(record.args)
                  return True
          """
          _redaction_new = """class SensitiveDataFilter(logging.Filter):
              def filter(self, record: logging.LogRecord) -> bool:
                  # Resolve lazy interpolation before redaction. Keeping the original
                  # args after replacing msg can leave stale `%s` placeholders.
                  record.msg = redact_text(record.getMessage())
                  record.args = ()
                  return True
          """
          if _redaction_text.count(_redaction_old) != 1:
              raise RuntimeError("redaction regression marker mismatch")
          _redaction.write_text(_redaction_text.replace(_redaction_old, _redaction_new, 1), encoding="utf-8")
          _provider = Path("src/tutor_assistant/ui/normalization_provider.py")
          _provider_text = _provider.read_text(encoding="utf-8")
          _provider_old = 'key_state = "ключ найден" if status.configured else status.detail'
          _provider_new = 'key_state = "ключ найден" if status.configured else f"задайте ключ: {status.detail}"'
          if _provider_text.count(_provider_old) != 1:
              raise RuntimeError("provider hint regression marker mismatch")
          _provider.write_text(_provider_text.replace(_provider_old, _provider_new, 1), encoding="utf-8")
          print("PR 38 focused regression fixes applied.")
          '''
          path.write_text(text, encoding="utf-8")
          '@ | python
          python -m py_compile scripts/apply_pr38.py
      - name: Generate product changes
        run: python scripts/apply_pr38.py
      - name: Preserve temporary workflows
        shell: bash
        run: |
          git checkout -- .github/workflows/windows-content.yml
          git checkout -- .github/workflows/pr38-bootstrap.yml
      - name: Install uv
        run: python -m pip install uv
      - name: Refresh lock
        run: uv lock
      - name: Install dependencies
        run: uv sync --extra desktop --group dev
      - name: Ruff autofix
        run: uv run ruff check . --fix
      - name: Compile
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Focused privacy tests
        run: >-
          uv run pytest -q
          tests/test_credential_store.py
          tests/test_cloud_consent.py
          tests/test_cloud_privacy_migration.py
          tests/test_cloud_request_envelope.py
          tests/test_sensitive_data_redaction.py
          tests/test_privacy_support_bundle.py
          tests/test_privacy_doctor.py
          tests/test_cloud_consent_cli.py
          tests/test_cloud_service_consent.py
          tests/test_normalization_provider_gui.py
          tests/test_normalization_service.py
      - name: Remove temporary payload
        shell: pwsh
        run: |
          Remove-Item scripts/apply_pr38.py -Force -ErrorAction SilentlyContinue
          Remove-Item .agent/pr38 -Recurse -Force -ErrorAction SilentlyContinue
      - name: Commit product implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement cloud privacy boundary and secure credentials"
          git push origin HEAD:security/cloud-processing-boundary

  content:
    if: github.event_name != 'pull_request' || github.head_ref != 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Check lock file
        run: uv lock --check
      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml
