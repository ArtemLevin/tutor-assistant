name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-pr38:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/cloud-processing-boundary

      - name: Check fix payload
        id: payload
        shell: pwsh
        run: |
          if (Test-Path scripts/pr38_finalize.py) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-python@v5
        if: steps.payload.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Apply safety correction
        if: steps.payload.outputs.present == 'true'
        run: python scripts/pr38_finalize.py

      - name: Install uv
        if: steps.payload.outputs.present == 'true'
        run: python -m pip install uv

      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: uv sync --extra desktop --group dev

      - name: Apply and verify Ruff fixes
        if: steps.payload.outputs.present == 'true'
        run: |
          uv run ruff check . --fix
          uv run ruff check .

      - name: Compile affected sources
        if: steps.payload.outputs.present == 'true'
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Verify privacy and cancellation contracts
        if: steps.payload.outputs.present == 'true'
        run: >-
          uv run pytest -q
          tests/test_cloud_service_consent.py
          tests/test_normalization_resume.py
          tests/test_sensitive_data_redaction.py
          tests/test_normalization_provider_gui.py
          --junitxml=pr38-finalize-tests.xml

      - name: Remove fix payload
        if: steps.payload.outputs.present == 'true' && success()
        shell: pwsh
        run: Remove-Item scripts/pr38_finalize.py -Force

      - name: Commit or diagnose final corrections
        if: steps.payload.outputs.present == 'true' && success()
        shell: bash
        run: |
          set +e
          : > pr38-commit.log
          git config user.name "github-actions[bot]" >> pr38-commit.log 2>&1
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" >> pr38-commit.log 2>&1
          echo '--- status before add ---' >> pr38-commit.log
          git status --short >> pr38-commit.log 2>&1
          git add -A >> pr38-commit.log 2>&1
          git reset -- .github/workflows/windows-content.yml >> pr38-commit.log 2>&1
          echo '--- staged status ---' >> pr38-commit.log
          git status --short >> pr38-commit.log 2>&1
          echo '--- staged stat ---' >> pr38-commit.log
          git diff --cached --stat >> pr38-commit.log 2>&1
          echo '--- whitespace check ---' >> pr38-commit.log
          git diff --cached --check >> pr38-commit.log 2>&1
          CHECK_CODE=$?
          echo "check_code=$CHECK_CODE" >> pr38-commit.log
          if [ "$CHECK_CODE" -eq 0 ]; then
            git commit -m "Harden cloud cancellation and finalize privacy lint" >> pr38-commit.log 2>&1
            COMMIT_CODE=$?
          else
            COMMIT_CODE=99
          fi
          echo "commit_code=$COMMIT_CODE" >> pr38-commit.log
          if [ "$COMMIT_CODE" -eq 0 ]; then
            git push origin HEAD:security/cloud-processing-boundary >> pr38-commit.log 2>&1
            PUSH_CODE=$?
          else
            PUSH_CODE=99
          fi
          echo "push_code=$PUSH_CODE" >> pr38-commit.log
          cat pr38-commit.log
          exit 0

      - name: Upload commit diagnostics
        if: always() && steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr38-commit-diagnostics
          path: pr38-commit.log
          if-no-files-found: ignore
