name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr34:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/restore-filtering-contracts'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Finalize PR 34 version and workflow
        id: apply
        shell: bash
        run: |
          if [[ ! -f scripts/finalize_pr34.py ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/finalize_pr34.py
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml uv.lock .github/workflows/windows-content.yml scripts/finalize_pr34.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Finalize PR 34 version and CI contracts"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  content:
    needs: bootstrap-pr34
    if: always() && needs.bootstrap-pr34.outputs.changed != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Check lock file
        run: uv lock --check
      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
