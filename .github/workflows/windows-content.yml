name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.state.outputs.changed }}
    steps:
      - id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "$HEAD_BRANCH"
          if grep -q 'version = "0.14.0"' pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          (
            set -e
            echo '== decode =='
            base64 -d scripts/pr37_bootstrap.py.gz.b64 | gzip -d > scripts/pr37_bootstrap.py
            echo '== apply =='
            python scripts/pr37_bootstrap.py
            echo '== install uv =='
            python -m pip install --quiet uv
            echo '== lock =='
            uv lock
            echo '== compile =='
            python -m compileall -q src/tutor_assistant tests
          ) > bootstrap-error.txt 2>&1
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            printf '\nexit_status=%s\n' "$status" >> bootstrap-error.txt
            cat bootstrap-error.txt
            exit "$status"
          fi
          rm -f bootstrap-error.txt
          git add README.md docs pyproject.toml uv.lock src tests
          git commit -m "Add durable resumable normalization checkpoints"
          git push --quiet origin "HEAD:${HEAD_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  content:
    needs: bootstrap
    if: needs.bootstrap.outputs.changed != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Check lock file
        run: uv lock --check
      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Filtering import smoke
        run: uv run python -c "from tutor_assistant.normalization.prompts import system_prompt; from tutor_assistant.ui.normalization_provider import provider_label; assert 'импульс' in system_prompt('physics').casefold(); assert provider_label('ollama') == 'Локальная LLM (Ollama)'"
      - name: Filtering feature contracts
        run: >-
          uv run pytest -q
          tests/test_filtering_feature_contracts.py
          tests/test_subject_aware_filtering.py
          tests/test_subject_manifest_compatibility.py
          tests/test_normalization_provider_gui.py
      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
