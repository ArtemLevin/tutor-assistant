name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ux5-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/workspace-navigation-ui-review'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/workspace-navigation-ui-review

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Apply reviewed UI fixes
        run: python scripts/apply_ui_review_patch.py

      - name: Remove bootstrap infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/apply_ui_review_patch.py
          git checkout origin/main -- .github/workflows/windows-content.yml

      - name: Synchronize lock file
        run: uv lock

      - name: Install desktop and test dependencies
        run: uv sync --extra desktop --group dev

      - name: Format reviewed files
        run: >-
          uv run ruff format
          src/tutor_assistant/ui/information_architecture.py
          src/tutor_assistant/ui/app.py
          tests/test_information_architecture_gui.py

      - name: Lint
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused workspace navigation tests
        run: >-
          uv run pytest -q --tb=short
          tests/test_information_architecture_gui.py
          tests/test_ux4_accessibility_gui.py
          tests/test_ux4_scaling_gui.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore workspace navigation visibility and focus"
          git push origin HEAD:fix/workspace-navigation-ui-review
