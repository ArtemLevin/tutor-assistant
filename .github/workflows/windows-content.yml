name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "$HEAD_BRANCH"
          python scripts/pr37_finalize.py
          git checkout HEAD -- .github/workflows/windows-content.yml .github/workflows/pr37-bootstrap.yml
          python -m compileall -q src/tutor_assistant tests
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize resumable normalization safety and tests"
          git push --quiet origin "HEAD:${HEAD_BRANCH}"
