name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ux4-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/ux4-accessibility'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ux4-accessibility

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Correct UX-4 patch markers
        shell: pwsh
        run: |
          $path = 'scripts/apply_ux4_patch.py'
          $content = [System.IO.File]::ReadAllText($path)
          $content = $content.Replace('subject_label, subject_value', 'subject_label')
          $content = $content.Replace('Текущая версия: **0.21.0**.', 'Текущая версия: **0.19.0**.')
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))

      - name: Apply UX-4 implementation
        run: python scripts/apply_ux4_patch.py

      - name: Remove temporary infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/apply_ux4_patch.py
          Remove-Item scripts/sitecustomize.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/ux4-bootstrap.yml
          git checkout origin/main -- .github/workflows/windows-content.yml

      - name: Synchronize lock file
        run: uv lock

      - name: Install desktop and test dependencies
        run: uv sync --extra desktop --group dev

      - name: Normalize UX-4 sources
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise RuntimeError(f"Expected one UX-4 marker in {path}: {old!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace(
              "src/tutor_assistant/ui/accessibility.py",
              "zip(ordered, ordered[1:])",
              "zip(ordered, ordered[1:], strict=False)",
          )
          replace(
              "src/tutor_assistant/ui/accessibility.py",
              "        if widget.focusPolicy() == Qt.FocusPolicy.NoFocus:\n            widget.setFocusPolicy(Qt.FocusPolicy.StrongFocus)",
              "        if isinstance(widget, QAbstractItemView):\n            widget.setTabKeyNavigation(False)\n        if isinstance(widget, QAbstractButton):\n            widget.setMinimumHeight(max(widget.minimumHeight(), 38))\n        if widget.focusPolicy() == Qt.FocusPolicy.NoFocus:\n            widget.setFocusPolicy(Qt.FocusPolicy.StrongFocus)",
          )
          replace(
              "src/tutor_assistant/ui/information_architecture.py",
              "    min-width: 214px;\n    max-width: 214px;",
              "    min-width: 272px;\n    max-width: 272px;",
          )
          replace(
              "tests/test_ux4_accessibility_gui.py",
              "    assert page.table.nextInFocusChain() is page.full_name",
              "    page.table.setFocus()\n    QTest.keyClick(page.table, Qt.Key.Key_Tab)\n    application.processEvents()\n    assert QApplication.focusWidget() is page.full_name",
          )
          replace(
              "tests/test_ux4_accessibility_gui.py",
              "    assert page.grid.nextInFocusChain() is page.open_selected_button",
              "    page.grid.setFocus()\n    QTest.keyClick(page.grid, Qt.Key.Key_Tab)\n    application.processEvents()\n    assert QApplication.focusWidget() is page.open_selected_button",
          )
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format `
            src/tutor_assistant/ui/accessibility.py `
            tests/test_ux4_accessibility_gui.py `
            tests/test_ux4_scaling_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check `
            src/tutor_assistant/ui/accessibility.py `
            src/tutor_assistant/ui/student_content.py `
            src/tutor_assistant/ui/information_architecture.py `
            tests/test_ux4_accessibility_gui.py `
            tests/test_ux4_scaling_gui.py `
            --fix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused UX-4 tests
        run: uv run pytest -q tests/test_ux4_accessibility_gui.py tests/test_ux4_scaling_gui.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement UX-4 accessibility"
          git push origin HEAD:feature/ux4-accessibility
