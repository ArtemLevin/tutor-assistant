name: Capture Ruff diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ruff-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/educational-content-filter-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Capture Ruff output
        shell: bash
        run: uvx ruff check . > ruff-report.txt 2>&1 || true
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruff-report.txt
          git commit -m "chore: publish focused ruff diagnostics"
          git push origin HEAD:agent/educational-content-filter-hardening
