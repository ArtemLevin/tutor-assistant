name: Windows student content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-pr38:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/cloud-processing-boundary'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/cloud-processing-boundary
      - name: Diagnose product patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $payload = '.agent/pr38/product.patch.b64'
          "payload_exists=$([IO.File]::Exists($payload))" | Set-Content pr38-patch-diagnostics.txt
          if (Test-Path $payload) {
            "payload_length=$((Get-Item $payload).Length)" | Add-Content pr38-patch-diagnostics.txt
            "payload_sha=$((Get-FileHash $payload -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-patch-diagnostics.txt
            try {
              python -c "import base64,pathlib; p=pathlib.Path('.agent/pr38/product.patch.b64'); pathlib.Path('.agent/pr38/product.patch.gz').write_bytes(base64.b64decode(p.read_text(), validate=True))" 2>&1 | Add-Content pr38-patch-diagnostics.txt
              "gzip_length=$((Get-Item .agent/pr38/product.patch.gz).Length)" | Add-Content pr38-patch-diagnostics.txt
              "gzip_sha=$((Get-FileHash .agent/pr38/product.patch.gz -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-patch-diagnostics.txt
              python -c "import gzip,pathlib; p=pathlib.Path('.agent/pr38/product.patch.gz'); pathlib.Path('.agent/pr38/product.patch').write_bytes(gzip.decompress(p.read_bytes()))" 2>&1 | Add-Content pr38-patch-diagnostics.txt
              "patch_length=$((Get-Item .agent/pr38/product.patch).Length)" | Add-Content pr38-patch-diagnostics.txt
              "patch_sha=$((Get-FileHash .agent/pr38/product.patch -Algorithm SHA256).Hash.ToLower())" | Add-Content pr38-patch-diagnostics.txt
              git apply --check --whitespace=error-all .agent/pr38/product.patch 2>&1 | Add-Content pr38-patch-diagnostics.txt
              "git_apply_exit=$LASTEXITCODE" | Add-Content pr38-patch-diagnostics.txt
            } catch {
              "exception=$($_.Exception.Message)" | Add-Content pr38-patch-diagnostics.txt
            }
          }
          Get-Content pr38-patch-diagnostics.txt
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr38-product-patch-diagnostics
          path: pr38-patch-diagnostics.txt
          if-no-files-found: error
