name: Windows student content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ux2-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/ux2-core-workflows'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ux2-core-workflows

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Apply UX-2 patch
        run: python scripts/apply_ux2_core_workflows.py

      - name: Remove bootstrap infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/apply_ux2_core_workflows.py
          Remove-Item .github/workflows/ux2-core-workflows-bootstrap.yml
          git checkout origin/main -- .github/workflows/windows-content.yml

      - name: Refresh lock file
        run: uv lock

      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev

      - name: Ruff autofix
        run: uv run ruff check . --fix

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused UX-2 tests
        run: >-
          uv run pytest -q --tb=short
          tests/test_ux2_core_workflows_gui.py
          tests/test_information_architecture_gui.py
          tests/test_transcript_workspace_gui.py
          tests/test_ui_localization.py

      - name: Full test suite
        run: uv run pytest -q --tb=short

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Commit validated UX-2 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement UX-2 core workflows"
          git push origin HEAD:feature/ux2-core-workflows

  content:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'feature/ux2-core-workflows'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Check lock file
        run: uv lock --check

      - name: Install test and desktop dependencies
        run: uv sync --extra desktop --group dev

      - name: Lint
        shell: pwsh
        run: |
          uv run ruff check . --output-format=concise 2>&1 | Tee-Object ruff-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-ruff-report
          path: ruff-report.txt
          if-no-files-found: ignore

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Privacy import smoke
        run: >-
          uv run python -c "from tutor_assistant.security import CloudConsentSession, credential_status, redact_text; assert redact_text('Authorization: Api-Key demo-secret-value') == 'Authorization: Api-Key [REDACTED]'; assert CloudConsentSession(); assert callable(credential_status)"

      - name: Added secret scan
        if: github.event_name == 'pull_request'
        run: uv run python scripts/scan_added_secrets.py ${{ github.event.pull_request.base.sha }}

      - name: Filtering, checkpoint and privacy contracts
        shell: pwsh
        run: |
          uv run pytest -q --tb=short --junitxml=contract-report.xml `
            tests/test_filtering_feature_contracts.py `
            tests/test_subject_aware_filtering.py `
            tests/test_subject_manifest_compatibility.py `
            tests/test_normalization_provider_gui.py `
            tests/test_normalization_checkpoint_migration.py `
            tests/test_normalization_checkpoint_store.py `
            tests/test_normalization_resume.py `
            tests/test_normalization_progress_gui.py `
            tests/test_transcript_workspace_gui.py `
            tests/test_credential_store.py `
            tests/test_cloud_consent.py `
            tests/test_cloud_privacy_migration.py `
            tests/test_cloud_request_envelope.py `
            tests/test_sensitive_data_redaction.py `
            tests/test_privacy_support_bundle.py `
            tests/test_privacy_doctor.py `
            tests/test_cloud_consent_cli.py `
            tests/test_cloud_service_consent.py 2>&1 | Tee-Object contract-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-contract-diagnostics
          path: |
            contract-report.xml
            contract-output.txt
          if-no-files-found: ignore

      - name: Validate patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Full test suite
        run: uv run pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
