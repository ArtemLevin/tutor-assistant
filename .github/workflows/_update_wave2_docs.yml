name: Update Wave 2 docs

on:
  push:
    branches:
      - docs/complete-wave2-start-wave3

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/complete-wave2-start-wave3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README and PLAN
        run: python scripts/_update_wave2_docs.py
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete wave2 and start wave3"
          git push origin HEAD:docs/complete-wave2-start-wave3
