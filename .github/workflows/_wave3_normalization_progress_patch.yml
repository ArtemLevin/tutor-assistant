name: Wave 3 normalization progress patch

on:
  push:
    branches:
      - agent/wave3-normalization-orchestration
    paths:
      - scripts/_trigger_wave3_normalization_progress.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave3-normalization-orchestration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply progress patch
        run: python scripts/_patch_wave3_normalization_progress.py
      - name: Validate migrated Python syntax
        run: python -m compileall -q src/tutor_assistant/application/normalization.py src/tutor_assistant/ui/normalization_presentation.py src/tutor_assistant/ui/app.py tests/test_normalization_presentation.py
      - name: Remove patch helpers
        run: |
          rm scripts/_patch_wave3_normalization_progress.py
          rm scripts/_trigger_wave3_normalization_progress.txt
          rm .github/workflows/_wave3_normalization_progress_patch.yml
      - name: Commit progress fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/app.py src/tutor_assistant/ui/normalization_presentation.py tests/test_normalization_presentation.py scripts/_patch_wave3_normalization_progress.py scripts/_trigger_wave3_normalization_progress.txt .github/workflows/_wave3_normalization_progress_patch.yml
          git commit -m "preserve normalization progress bar state"
          git push origin HEAD:agent/wave3-normalization-orchestration
