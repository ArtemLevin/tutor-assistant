name: Wave2 composition migration

on:
  push:
    branches:
      - agent/wave2-production-composition-cleanup

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave2-production-composition-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic composition cleanup
        run: python scripts/_migrate_wave2_composition.py
      - name: Commit migrated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(ui): make production composition explicit"
          git push origin HEAD:agent/wave2-production-composition-cleanup
