name: Wave 3 Slice 13 docs

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  update-docs:
    if: github.head_ref == 'docs/complete-wave3-slice13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/complete-wave3-slice13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update roadmap docs
        run: python scripts/_update_wave3_slice13_docs.py
      - name: Remove migration helpers
        run: |
          rm scripts/_update_wave3_slice13_docs.py
          rm .github/workflows/_wave3_slice13_docs.yml
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PLAN.md scripts/_update_wave3_slice13_docs.py .github/workflows/_wave3_slice13_docs.yml
          git commit -m "docs: complete wave3 slice13"
          git push origin HEAD:docs/complete-wave3-slice13
