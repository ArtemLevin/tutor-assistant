name: Bootstrap PR32 subject-aware filtering

on:
  push:
    branches:
      - agent/subject-aware-content-filtering

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subject-aware-content-filtering
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply PR32 changes
        run: python scripts/apply_pr32_subject_profiles.py
      - name: Install uv
        run: python -m pip install uv
      - name: Sync test environment
        run: uv sync --group dev --extra desktop
      - name: Format and lint
        run: |
          uv run ruff check --fix src/tutor_assistant/normalization src/tutor_assistant/ui/normalization.py tests/test_subject_aware_filtering.py tests/test_normalization_models.py
          uv run ruff format src/tutor_assistant/normalization src/tutor_assistant/ui/normalization.py tests/test_subject_aware_filtering.py tests/test_normalization_models.py
          uv run ruff check .
      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests
      - name: Run subject profile tests
        run: uv run pytest -q tests/test_subject_aware_filtering.py tests/test_normalization_models.py tests/test_normalization_service.py tests/test_normalization_ollama.py tests/test_normalization_yandex.py
      - name: Run full test suite
        run: uv run pytest -q
      - name: Commit product changes
        shell: bash
        run: |
          rm scripts/apply_pr32_subject_profiles.py
          rm .github/workflows/bootstrap-pr32-subject-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add subject-aware educational content filtering"
          git push origin HEAD:agent/subject-aware-content-filtering
