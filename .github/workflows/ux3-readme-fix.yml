name: UX-3 README version synchronization

on:
  push:
    branches:
      - feature/ux3-crm-materials

permissions:
  contents: write

concurrency:
  group: ux3-readme-version-sync
  cancel-in-progress: true

jobs:
  synchronize:
    if: contains(github.event.head_commit.modified, 'scripts/fix_ux3_readme_version.py')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ux3-crm-materials

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize README version
        run: python scripts/fix_ux3_readme_version.py

      - name: Remove one-time infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/fix_ux3_readme_version.py
          Remove-Item .github/workflows/ux3-readme-fix.yml

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize README with version 0.21.0"
          git push origin HEAD:feature/ux3-crm-materials
