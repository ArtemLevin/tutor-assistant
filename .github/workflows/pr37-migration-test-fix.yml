name: PR 37 migration expectation fix

on:
  push:
    branches: [agent/resumable-normalization-checkpoints]
    paths:
      - .github/workflows/pr37-migration-test-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resumable-normalization-checkpoints
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update migration expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_student_content.py')
          text = path.read_text(encoding='utf-8')
          old_list = '''        (8, "transcript_normalization"),
    ]'''
          new_list = '''        (8, "transcript_normalization"),
        (9, "resumable_normalization_chunks"),
    ]'''
          if old_list not in text:
              raise SystemExit('migration list marker not found')
          text = text.replace(old_list, new_list, 1)
          text = text.replace(
              'assert len(repository.applied_migrations()) == 8',
              'assert len(repository.applied_migrations()) == 9',
              1,
          )
          text = text.replace(
              '"SELECT COUNT(*) FROM schema_migrations").fetchone()[0] == 8',
              '"SELECT COUNT(*) FROM schema_migrations").fetchone()[0] == 9',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q tests/test_student_content.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_student_content.py
          git commit -m "Update migration expectations for resumable checkpoints"
          git push origin HEAD:agent/resumable-normalization-checkpoints
