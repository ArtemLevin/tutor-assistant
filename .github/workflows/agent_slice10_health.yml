name: agent slice10 recording health migration

on:
  push:
    branches:
      - agent/wave2-recording-health-policy
    paths:
      - .github/agent_slice10_health.py
      - .github/workflows/agent_slice10_health.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave2-recording-health-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic migration
        run: python .github/agent_slice10_health.py
      - name: Commit migrated production code
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'refactor(recording): move live health policy to application layer'
          git push
