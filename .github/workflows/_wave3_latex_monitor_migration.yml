name: Wave 3 LaTeX monitor migration

on:
  push:
    branches:
      - agent/wave3-latex-monitor-orchestration
    paths:
      - scripts/_run_wave3_latex_monitor_migration.trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave3-latex-monitor-orchestration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply migration
        run: python scripts/_migrate_wave3_latex_monitor.py
      - name: Validate migrated Python syntax
        run: python -m compileall -q src/tutor_assistant/application/latex_monitor.py src/tutor_assistant/ui/latex_monitor_presentation.py src/tutor_assistant/ui/app.py
      - name: Remove migration helpers
        run: |
          rm scripts/_migrate_wave3_latex_monitor.py
          rm scripts/_run_wave3_latex_monitor_migration.trigger
          rm .github/workflows/_wave3_latex_monitor_migration.yml
      - name: Commit migrated production path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "route latex monitor through application coordinator"
          git push origin HEAD:agent/wave3-latex-monitor-orchestration
