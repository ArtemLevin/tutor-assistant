name: PR42 preserve model candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-pr42:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.ref == 'fix/preserve-model-review-candidates' && github.actor != 'github-actions[bot]')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/preserve-model-review-candidates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply candidate-preservation patch
        shell: pwsh
        run: |
          python scripts/pr42_preserve_model_candidates.py 2>&1 | Tee-Object patch-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr42-patch-diagnostics
          path: patch-output.txt
          if-no-files-found: ignore

      - name: Install uv
        run: python -m pip install uv

      - name: Refresh lock and dependencies
        run: |
          uv lock
          uv sync --extra desktop --group dev

      - name: Lint and compile
        run: |
          uv run ruff check . --fix
          uv run ruff check .
          uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused normalization tests
        run: >-
          uv run pytest -q
          tests/test_normalization_validation.py
          tests/test_normalization_service.py
          tests/test_normalization_resume.py
          tests/test_normalization_checkpoint_store.py
          tests/test_transcript_workspace_gui.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            pyproject.toml \
            uv.lock \
            src/tutor_assistant/__init__.py \
            src/tutor_assistant/normalization/models.py \
            src/tutor_assistant/normalization/service.py \
            src/tutor_assistant/normalization/validation.py \
            src/tutor_assistant/ui/app.py \
            tests/test_normalization_service.py \
            tests/test_normalization_validation.py
          git diff --cached --check
          git commit -m "Preserve model output as review candidate"
          git push origin HEAD:fix/preserve-model-review-candidates
