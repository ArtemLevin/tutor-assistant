name: Windows accessibility scaling

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaling:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scale-factor: ['1', '1.25', '1.5', '2']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_ENABLE_HIGHDPI_SCALING: '1'
      QT_SCALE_FACTOR: ${{ matrix.scale-factor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Check lock file
        run: uv lock --check

      - name: Install desktop and test dependencies
        run: uv sync --extra desktop --group dev

      - name: Accessibility and scaling contracts
        run: >-
          uv run pytest -q --tb=short
          tests/test_ux4_accessibility_gui.py
          tests/test_ux4_scaling_gui.py
          tests/test_lesson_journal_layout_recursion.py
          tests/test_ux6_teacher_cockpit_gui.py
