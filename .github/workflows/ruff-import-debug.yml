name: Ruff import diagnostic

on:
  pull_request:
    paths:
      - src/tutor_assistant/recording/output.py
      - src/tutor_assistant/ui/transcript_publication_app.py
      - .github/workflows/ruff-import-debug.yml

permissions:
  contents: read

jobs:
  import-order:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev --extra desktop
      - name: Show canonical import diff
        shell: pwsh
        run: |
          uv run ruff check src/tutor_assistant/recording/output.py src/tutor_assistant/ui/transcript_publication_app.py --select I --fix
          git diff -- src/tutor_assistant/recording/output.py src/tutor_assistant/ui/transcript_publication_app.py
