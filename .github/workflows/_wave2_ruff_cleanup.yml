name: Wave 2 Ruff cleanup

on:
  push:
    branches:
      - agent/wave2-remove-legacy-recording

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/wave2-remove-legacy-recording
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix cleanup fallout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tutor_assistant/ui/app.py')
          text = path.read_text(encoding='utf-8')
          old = 'from ..atomic_io import atomic_write_text\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one atomic_io import, got {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          python -m pip install 'ruff>=0.9,<1'
          ruff check tests/test_recording_ui_architecture.py --fix
          rm .github/workflows/_wave2_ruff_cleanup.yml
      - name: Commit Ruff cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(recording): fix cleanup lint fallout"
          git push origin HEAD:agent/wave2-remove-legacy-recording
