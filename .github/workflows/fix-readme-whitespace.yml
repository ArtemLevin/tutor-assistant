name: Fix README whitespace

on:
  push:
    branches:
      - agent/gui-content-filter-provider-selector

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gui-content-filter-provider-selector
          fetch-depth: 0
      - name: Remove trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Fix README trailing whitespace"
          git push origin HEAD:agent/gui-content-filter-provider-selector
