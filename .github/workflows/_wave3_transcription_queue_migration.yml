name: Wave 3 transcription queue migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - agent/wave3-transcription-queue-boundary
    paths:
      - scripts/_migrate_wave3_transcription_queue.py
      - scripts/_patch_wave3_transcription_migration.py
      - .github/workflows/_wave3_transcription_queue_migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/wave3-transcription-queue-boundary' || github.ref_name == 'agent/wave3-transcription-queue-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave3-transcription-queue-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch migration transform
        run: python scripts/_patch_wave3_transcription_migration.py
      - name: Apply migration
        run: python scripts/_migrate_wave3_transcription_queue.py
      - name: Diagnose raw queue references
        if: failure()
        run: |
          grep -n "self\.transcription_queue\." src/tutor_assistant/ui/app.py || true
          grep -n "self\.transcription_queue\." src/tutor_assistant/ui/concurrent_app.py || true
      - name: Remove migration helpers
        run: |
          rm scripts/_migrate_wave3_transcription_queue.py
          rm scripts/_patch_wave3_transcription_migration.py
          rm .github/workflows/_wave3_transcription_queue_migration.yml
      - name: Commit migrated production path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/app.py src/tutor_assistant/ui/concurrent_app.py scripts/_migrate_wave3_transcription_queue.py scripts/_patch_wave3_transcription_migration.py .github/workflows/_wave3_transcription_queue_migration.yml
          git commit -m "route transcription queue through application coordinator"
          git push origin HEAD:agent/wave3-transcription-queue-boundary
