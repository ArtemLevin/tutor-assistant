name: LaTeX monitor import fix

on:
  push:
    branches:
      - agent/wave3-latex-monitor-orchestration
    paths:
      - scripts/_run_latex_monitor_import_fix.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave3-latex-monitor-orchestration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply import fix
        run: python scripts/_fix_latex_monitor_imports.py
      - name: Remove helpers
        run: |
          rm scripts/_fix_latex_monitor_imports.py
          rm scripts/_run_latex_monitor_import_fix.trigger
          rm .github/workflows/_latex_monitor_import_fix.yml
      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix latex monitor import ordering"
          git push origin HEAD:agent/wave3-latex-monitor-orchestration
