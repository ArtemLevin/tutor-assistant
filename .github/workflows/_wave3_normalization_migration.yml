name: Wave 3 normalization migration

on:
  push:
    branches:
      - agent/wave3-normalization-orchestration
    paths:
      - scripts/_trigger_wave3_normalization.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave3-normalization-orchestration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply migration
        run: python scripts/_migrate_wave3_normalization.py
      - name: Validate migrated Python syntax
        run: python -m compileall -q src/tutor_assistant/application/normalization.py src/tutor_assistant/ui/normalization_presentation.py src/tutor_assistant/ui/app.py
      - name: Remove migration helpers
        run: |
          rm scripts/_migrate_wave3_normalization.py
          rm scripts/_trigger_wave3_normalization.txt
          rm .github/workflows/_wave3_normalization_migration.yml
      - name: Commit migrated production path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/app.py scripts/_migrate_wave3_normalization.py scripts/_trigger_wave3_normalization.txt .github/workflows/_wave3_normalization_migration.yml
          git commit -m "route normalization through application coordinator"
          git push origin HEAD:agent/wave3-normalization-orchestration
