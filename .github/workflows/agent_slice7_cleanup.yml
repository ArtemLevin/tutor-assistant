name: Agent Slice 7 Cleanup

on:
  push:
    branches:
      - agent/wave2-remove-legacy-audio-preflight

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave2-remove-legacy-audio-preflight
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite legacy preflight block
        run: python .github/agent_slice7_cleanup.py
      - name: Commit cleanup and remove temporary automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/app.py
          git rm .github/agent_slice7_cleanup.py .github/workflows/agent_slice7_cleanup.yml
          git commit -m "refactor(audio): remove legacy base preflight"
          git push origin HEAD:agent/wave2-remove-legacy-audio-preflight
