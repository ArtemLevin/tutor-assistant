name: Wave 3 Slice 15 docs migration

on:
  push:
    branches:
      - docs/complete-wave3-slice15
    paths:
      - scripts/_run_wave3_slice15_docs.trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/complete-wave3-slice15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update docs
        run: python scripts/_update_wave3_slice15_docs.py
      - name: Remove helpers
        run: |
          rm scripts/_update_wave3_slice15_docs.py
          rm scripts/_run_wave3_slice15_docs.trigger
          rm .github/workflows/_wave3_slice15_docs.yml
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete wave3 slice15"
          git push origin HEAD:docs/complete-wave3-slice15
