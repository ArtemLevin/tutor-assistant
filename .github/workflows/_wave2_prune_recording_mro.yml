name: Wave 2 recording MRO cleanup

on:
  push:
    branches:
      - agent/wave2-remove-legacy-recording

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/wave2-remove-legacy-recording
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prune dead recording callback bridges
        run: python tools/_wave2_prune_recording_mro.py
      - name: Commit generated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(recording): prune dead UI callback bridges"
          git push origin HEAD:agent/wave2-remove-legacy-recording
