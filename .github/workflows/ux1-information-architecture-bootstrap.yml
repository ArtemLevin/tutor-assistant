name: UX-1 information architecture bootstrap

on:
  push:
    branches:
      - feature/ux1-information-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ux1-information-architecture-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ux1-information-architecture

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Apply UX-1 patch
        run: python scripts/run_ux1_information_architecture.py

      - name: Remove bootstrap scripts before validation
        shell: pwsh
        run: |
          Remove-Item scripts/apply_ux1_information_architecture.py
          Remove-Item scripts/run_ux1_information_architecture.py

      - name: Refresh lock file
        run: uv lock

      - name: Install test dependencies
        run: uv sync --extra desktop --group dev

      - name: Ruff autofix
        run: uv run ruff check . --fix

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused UX-1 tests
        run: >-
          uv run pytest -q --tb=short
          tests/test_information_architecture_gui.py
          tests/test_ui_localization.py
          tests/test_transcript_workspace_gui.py

      - name: Full test suite
        run: uv run pytest -q --tb=short

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Remove bootstrap workflow
        shell: pwsh
        run: Remove-Item .github/workflows/ux1-information-architecture-bootstrap.yml

      - name: Commit validated UX-1 implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement UX-1 information architecture"
          git push origin HEAD:feature/ux1-information-architecture
