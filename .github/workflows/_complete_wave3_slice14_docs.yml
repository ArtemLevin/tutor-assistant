name: Wave 3 Slice 14 docs

on:
  push:
    branches:
      - docs/complete-wave3-slice14
    paths:
      - scripts/_trigger_complete_wave3_slice14_docs.txt

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/complete-wave3-slice14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update roadmap docs
        run: python scripts/_complete_wave3_slice14_docs.py
      - name: Remove migration helpers
        run: |
          rm scripts/_complete_wave3_slice14_docs.py
          rm scripts/_trigger_complete_wave3_slice14_docs.txt
          rm .github/workflows/_complete_wave3_slice14_docs.yml
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PLAN.md scripts/_complete_wave3_slice14_docs.py scripts/_trigger_complete_wave3_slice14_docs.txt .github/workflows/_complete_wave3_slice14_docs.yml
          git commit -m "docs: complete wave3 slice14"
          git push origin HEAD:docs/complete-wave3-slice14
