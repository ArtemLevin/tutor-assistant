name: Agent Slice 7 Lint Fix

on:
  push:
    branches:
      - agent/wave2-remove-legacy-audio-preflight

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave2-remove-legacy-audio-preflight
          fetch-depth: 0
      - name: Remove stale datetime import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tutor_assistant/ui/app.py')
          text = path.read_text(encoding='utf-8')
          old = 'from datetime import date, datetime, timedelta\n'
          new = 'from datetime import date, timedelta\n'
          if old not in text:
              raise SystemExit('expected datetime import not found')
          text = text.replace(old, new, 1)
          if 'datetime.now' in text:
              raise SystemExit('datetime.now still used in base UI')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit lint cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/app.py
          git rm .github/workflows/agent_slice7_lintfix.yml
          git commit -m "refactor(audio): remove stale preflight datetime import"
          git push origin HEAD:agent/wave2-remove-legacy-audio-preflight
