name: UX-4 accessibility bootstrap

on:
  push:
    branches:
      - feature/ux4-accessibility

permissions:
  contents: write

concurrency:
  group: ux4-accessibility-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    if: contains(github.event.head_commit.modified, 'scripts/apply_ux4_patch.py') || contains(github.event.head_commit.added, 'scripts/apply_ux4_patch.py')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ux4-accessibility

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Apply UX-4 implementation
        run: python scripts/apply_ux4_patch.py

      - name: Remove bootstrap infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/apply_ux4_patch.py
          Remove-Item .github/workflows/ux4-bootstrap.yml

      - name: Synchronize lock file
        run: uv lock

      - name: Install desktop and test dependencies
        run: uv sync --extra desktop --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall -q src/tutor_assistant tests

      - name: Focused UX-4 tests
        run: uv run pytest -q tests/test_ux4_accessibility_gui.py tests/test_ux4_scaling_gui.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement UX-4 accessibility"
          git push origin HEAD:feature/ux4-accessibility
