name: Apply next-lesson regression fix

on:
  push:
    branches:
      - fix/remove-stale-prepare-next-lesson

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-stale-prepare-next-lesson

      - name: Patch stale lesson reset calls and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/tutor_assistant/ui/app.py")
          source = app_path.read_text(encoding="utf-8")
          stale = "            self._prepare_next_lesson()\n"
          count = source.count(stale)
          if count != 2:
              raise SystemExit(f"expected exactly 2 stale _prepare_next_lesson calls, found {count}")
          source = source.replace(stale, "")
          if "_prepare_next_lesson" in source:
              raise SystemExit("stale _prepare_next_lesson reference remains after patch")
          app_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_ui_state.py")
          tests = test_path.read_text(encoding="utf-8")
          if not tests.startswith("import ast\n"):
              tests = "import ast\nfrom pathlib import Path\n\n" + tests
          test_name = "test_main_window_does_not_reference_removed_prepare_next_lesson"
          if test_name not in tests:
              tests += '''\n\ndef test_main_window_does_not_reference_removed_prepare_next_lesson() -> None:\n    source = Path("src/tutor_assistant/ui/app.py").read_text(encoding="utf-8")\n    tree = ast.parse(source)\n    stale_calls = [\n        node\n        for node in ast.walk(tree)\n        if isinstance(node, ast.Call)\n        and isinstance(node.func, ast.Attribute)\n        and node.func.attr == "_prepare_next_lesson"\n    ]\n    assert stale_calls == []\n'''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
          test "$(grep -R --fixed-strings '_prepare_next_lesson' src/tutor_assistant/ui/app.py | wc -l)" -eq 0

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_apply-fix-prepare-next-lesson.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/app.py tests/test_ui_state.py .github/workflows/_apply-fix-prepare-next-lesson.yml
          git diff --cached --check
          git commit -m "fix(ui): remove stale next-lesson callback"
          git push origin HEAD:fix/remove-stale-prepare-next-lesson
