name: Wave2 audio device boundary migration

on:
  push:
    branches:
      - agent/wave2-audio-device-boundary
    paths:
      - scripts/_wave2_audio_device_boundary.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave2-audio-device-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic migration
        run: python scripts/_wave2_audio_device_boundary.py
      - name: Remove one-shot migration files
        shell: bash
        run: |
          rm -f scripts/_wave2_audio_device_boundary.py
          rm -f .github/workflows/wave2-audio-device-boundary.yml
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor(audio): isolate device discovery behind application boundary"
          git push origin HEAD:agent/wave2-audio-device-boundary
