name: Agent Slice 11 Docs Migration

on:
  push:
    branches:
      - docs/advance-wave2-slice12
    paths:
      - .github/workflows/agent_docs_slice11.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/advance-wave2-slice12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README
        run: python .github/agent_docs_slice11.py
      - name: Remove one-shot migration files
        run: rm .github/agent_docs_slice11.py .github/workflows/agent_docs_slice11.yml
      - name: Commit docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: mark wave2 slice11 complete"
          git push origin HEAD:docs/advance-wave2-slice12
