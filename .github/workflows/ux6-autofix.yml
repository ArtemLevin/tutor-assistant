name: UX6 autofix

on:
  push:
    branches:
      - feature/ux6-teacher-cockpit-fix2

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: windows-2025
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ux6-teacher-cockpit-fix2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra desktop --group dev
      - name: Apply Ruff fixes
        shell: pwsh
        run: |
          uv run ruff check src/tutor_assistant/ui/information_architecture.py src/tutor_assistant/ui/teacher_cockpit.py tests/test_ux6_teacher_cockpit_gui.py --fix
          uv run ruff format src/tutor_assistant/ui/information_architecture.py src/tutor_assistant/ui/teacher_cockpit.py tests/test_ux6_teacher_cockpit_gui.py
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant/ui/information_architecture.py src/tutor_assistant/ui/teacher_cockpit.py tests/test_ux6_teacher_cockpit_gui.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(ui): format UX-6 implementation"
            git push origin HEAD:feature/ux6-teacher-cockpit-fix2
          }
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_ux6_teacher_cockpit_gui.py tests/test_information_architecture_gui.py
      - run: uv run pytest -q
