name: PR 37 Ruff autofix

on:
  push:
    branches: [agent/resumable-normalization-checkpoints]
    paths:
      - .github/workflows/pr37-ruff-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resumable-normalization-checkpoints
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check . --fix
      - run: ruff check .
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m "Apply Ruff fixes to resumable normalization"
          git push origin HEAD:agent/resumable-normalization-checkpoints
