name: Bootstrap content filter hardening

on:
  push:
    branches:
      - agent/educational-content-filter-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/educational-content-filter-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep workflow changes outside product commit
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/apply_content_filter_hardening.py')
          text = path.read_text(encoding='utf-8')
          cleanup = '(ROOT / ".github/workflows/bootstrap-content-filter-hardening.yml").unlink(missing_ok=True)\n'
          if cleanup not in text:
              raise SystemExit('workflow cleanup fragment not found')
          text = text.replace(cleanup, '')
          pattern = r"# CI on pull requests and merged main, with the declared Python compatibility range\.\nwrite\(\n    \"\.github/workflows/windows-content\.yml\",.*?\n\)\n\n# Provider tests now intercept the shared cancellable transport\."
          text, count = re.subn(
              pattern,
              '# Provider tests now intercept the shared cancellable transport.',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'windows workflow patch block count={count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply product changes
        run: python scripts/apply_content_filter_hardening.py
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement educational content filtering hardening"
          git push origin HEAD:agent/educational-content-filter-hardening
