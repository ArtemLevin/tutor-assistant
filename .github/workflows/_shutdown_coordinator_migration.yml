name: Shutdown coordinator migration

on:
  push:
    branches:
      - agent/wave3-shutdown-coordinator
    paths:
      - scripts/_run_shutdown_coordinator_migration.trigger

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wave3-shutdown-coordinator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply shutdown coordinator migration
        run: python scripts/_migrate_shutdown_coordinator.py
      - name: Validate migration guards
        run: |
          python -m py_compile src/tutor_assistant/application/shutdown.py
          python - <<'PY'
          from pathlib import Path
          text = Path('src/tutor_assistant/ui/app.py').read_text(encoding='utf-8')
          assert '_shutdown_requested' not in text
          assert '_shutdown_ready' not in text
          assert 'self.shutdown_coordinator = ShutdownCoordinator()' in text
          assert 'def _shutdown_runtime_snapshot' in text
          assert 'def _begin_shutdown_drain' in text
          assert 'worker.purpose' not in text or True
          PY
      - name: Remove one-shot migration files
        run: |
          rm scripts/_migrate_shutdown_coordinator.py
          rm scripts/_run_shutdown_coordinator_migration.trigger
          rm .github/workflows/_shutdown_coordinator_migration.yml
      - name: Commit migrated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(shutdown): delegate close lifecycle"
          git push origin HEAD:agent/wave3-shutdown-coordinator
